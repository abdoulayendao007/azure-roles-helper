name: Publication GitHub Pages (main + dev)

# Publie la branche main à la racine du site et la branche dev sous /dev/.
on:
  push:
    branches: [main, dev]
  workflow_run: # après la mise à jour hebdomadaire des rôles (ses commits ne déclenchent pas "push")
    workflows: ["Mise à jour des rôles intégrés"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Récupérer dev
        uses: actions/checkout@v5
        with:
          ref: dev
          path: dev

      - name: Assembler le site
        run: |
          mkdir -p site/dev
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' main/ site/
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' dev/ site/dev/
          # Les données sont produites sur main : la version dev les reprend (en gardant ses fichiers propres)
          if [ -d main/data ]; then mkdir -p site/dev/data && cp -r main/data/. site/dev/data/; fi
          # Bandeau pour reconnaître la version de développement
          sed -i 's|<body>|<body><div style="background:#b45309;color:#fff;text-align:center;padding:6px;font:600 14px system-ui">Version de développement (branche dev) · <a style="color:#fff" href="../">voir la production</a></div>|' site/dev/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
