name: Mise à jour des rôles intégrés

on:
  schedule:
    - cron: "17 10 * * 1" # chaque lundi, 10h17 UTC
  workflow_dispatch:

permissions:
  id-token: write # jeton OIDC pour azure/login (aucun secret client stocké)
  contents: write # commit des fichiers data/

concurrency:
  group: update-roles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Exporter les rôles
        run: python3 scripts/export_roles.py

      - name: Commit si changement
        if: always()
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour automatique des rôles intégrés"
          git push
